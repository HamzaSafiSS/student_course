# Use H2 in-memory database for tests (overrides MySQL in main application.properties)
# This file ONLY affects tests (mvn test). The real app still uses src/main/resources/application.properties
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Defer data.sql initialization until after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true

# Do not run data.sql — tests create their own data programmatically
spring.sql.init.mode=never

# JWT config (same values as main, required for context startup)
jwt.secret=29f2141c68d9cee5e0287da5eb686fdccbd7a11066a456b2365cdc4f3c7051c4
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Disable SSL for tests (no keystore needed)
server.port=0
server.ssl.enabled=false
